name: s1-4x-haskell
version: 0.1.0.0
github: robinhood0107/Capstone-AI-Trading-Coach
license: MIT
author: Park Jongjin
maintainer: robinhood0107
category: Finance
synopsis: Isolated Haskell numeric parity candidate for S1.4X
description: See README.md.

language: GHC2024

default-extensions:
  - NoCPP
  - NoDeriveAnyClass
  - NoDerivingVia
  - NoForeignFunctionInterface
  - NoGeneralizedNewtypeDeriving
  - NoLinearTypes
  - NoMagicHash
  - NoRebindableSyntax
  - NoStrict
  - NoTemplateHaskell
  - OverloadedStrings

ghc-options:
  - -Wall
  - -Werror
  - -Wcompat
  - -Widentities
  - -Wincomplete-patterns
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wincomplete-record-selectors
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wmissing-deriving-strategies
  - -Wmissing-export-lists
  - -Wmissing-import-lists
  - -Wmissing-signatures
  - -Wmissing-home-modules
  - -Wunused-packages
  - -Woperator-whitespace-ext-conflict

library:
  source-dirs: src
  dependencies:
    # base/deepseq는 compiler boot set이므로 GHC 9.14 compatibility lane에서 exact
    # version을 강제하지 않는다. 아래 non-boot package는 LTS 24.50 version을 고정한다.
    - base
    - SHA == 1.6.4.4
    - aeson == 2.2.5.0
    - attoparsec == 0.14.4
    - binary
    - bytestring
    - containers
    - deepseq
    - directory
    - filepath
    - math-functions == 0.3.4.4
    - scientific
    - statistics == 0.16.5.0
    - text
    - unix
    - vector == 0.13.2.0

executables:
  s1-4x-haskell:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N1
    dependencies:
      # compiler boot packages are intentionally unbounded; Stack's exact compiler
      # and boot-set manifest own these versions.
      - base
      - bytestring
      - containers
      - directory
      - filepath
      - s1-4x-haskell

tests:
  s1-4x-haskell-test:
    main: Main.hs
    source-dirs: test
    dependencies:
      - QuickCheck == 2.15.0.1
      - aeson == 2.2.5.0
      - base
      - bytestring
      - directory
      - filepath
      - s1-4x-haskell
      - tasty == 1.5.4
      - tasty-hunit == 0.10.2
      - tasty-quickcheck == 0.11.1
      - text
      - time
      - vector == 0.13.2.0

benchmarks:
  s1-4x-haskell-benchmark:
    main: Main.hs
    source-dirs: benchmark
    ghc-options:
      - -threaded
      - -rtsopts
    dependencies:
      - aeson == 2.2.5.0
      - base
      - criterion == 1.6.4.0
      - deepseq
      - s1-4x-haskell
      - text
      - vector == 0.13.2.0
