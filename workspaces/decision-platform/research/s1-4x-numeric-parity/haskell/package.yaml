name: s1-4x-haskell
version: 0.1.0.0
github: robinhood0107/Capstone-AI-Trading-Coach
license: MIT
author: Park Jongjin
maintainer: robinhood0107
category: Finance
synopsis: Isolated Haskell numeric parity candidate for S1.4X
description: See README.md.

language: GHC2024

default-extensions:
  - NoCPP
  - NoDeriveAnyClass
  - NoDerivingVia
  - NoForeignFunctionInterface
  - NoGeneralizedNewtypeDeriving
  - NoLinearTypes
  - NoMagicHash
  - NoRebindableSyntax
  - NoStrict
  - NoTemplateHaskell

ghc-options:
  - -Wall
  - -Werror
  - -Wcompat
  - -Widentities
  - -Wincomplete-patterns
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wincomplete-record-selectors
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wmissing-deriving-strategies
  - -Wmissing-export-lists
  - -Wmissing-import-lists
  - -Wmissing-signatures
  - -Wmissing-home-modules
  - -Wunused-packages
  - -Woperator-whitespace-ext-conflict

library:
  source-dirs: src
  dependencies:
    - base == 4.20.0.0
    - deepseq == 1.5.0.0
    - math-functions == 0.3.4.4
    - statistics == 0.16.5.0
    - vector == 0.13.2.0

executables:
  s1-4x-haskell:
    main: Main.hs
    source-dirs: app
    threaded: true
    rts-options:
      - -N1
    dependencies:
      - SHA == 1.6.4.4
      - aeson == 2.2.5.0
      - attoparsec == 0.14.4
      - base == 4.20.0.0
      - binary == 0.8.9.3
      - bytestring == 0.12.2.0
      - containers == 0.7
      - directory == 1.3.8.5
      - filepath == 1.5.2.0
      - scientific == 0.3.8.0
      - s1-4x-haskell
      - text == 2.1.2

tests:
  s1-4x-haskell-test:
    main: Main.hs
    source-dirs: test
    dependencies:
      - SHA == 1.6.4.4
      - QuickCheck == 2.15.0.1
      - aeson == 2.2.5.0
      - base == 4.20.0.0
      - bytestring == 0.12.2.0
      - containers == 0.7
      - directory == 1.3.8.5
      - filepath == 1.5.2.0
      - s1-4x-haskell
      - tasty == 1.5.4
      - tasty-hunit == 0.10.2
      - tasty-quickcheck == 0.11.1
      - text == 2.1.2
      - vector == 0.13.2.0

benchmarks:
  s1-4x-haskell-benchmark:
    main: Main.hs
    source-dirs: benchmark
    ghc-options:
      - -threaded
      - -rtsopts
    dependencies:
      - base == 4.20.0.0
      - criterion == 1.6.4.0
      - deepseq == 1.5.0.0
      - s1-4x-haskell
      - vector == 0.13.2.0
