  frozen-python-regressions:
    name: Existing S1.4 production and S1.4R regression
    needs: contract-reference-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - *setup_uv
      - *expose_uv

      - name: Run typed production and frozen S1.4R regression evidence
        shell: bash
        run: |
          set -euo pipefail
          S1_4X="$GITHUB_WORKSPACE/workspaces/decision-platform/research/s1-4x-numeric-parity"
          EVIDENCE_ROOT="$RUNNER_TEMP/s1-4x-regression-evidence"
          OUTPUT_ROOT="$EVIDENCE_ROOT/regression"
          mkdir -p "$EVIDENCE_ROOT"
          SUBJECT="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$SUBJECT" = "$GITHUB_SHA"
          UV_SHA256="$(sha256sum "$S1_4X_UV_BIN" | awk '{print $1}')"
          "$S1_4X_UV_BIN" run --frozen --no-config --project "$S1_4X/oracle" \
            python "$S1_4X/integration/regression_gate.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-root "$OUTPUT_ROOT" \
            --uv-bin "$S1_4X_UV_BIN" \
            --uv-sha256 "$UV_SHA256" \
            --benchmark-subject-commit "$SUBJECT"
          test -f "$OUTPUT_ROOT/production-compound-receipt.v1.json"
          test -f "$OUTPUT_ROOT/research-compound-receipt.v1.json"

      - name: Enforce typed regression evidence size cap
        shell: bash
        run: |
          set -euo pipefail
          artifact_bytes="$(
            du -sb "$RUNNER_TEMP/s1-4x-regression-evidence" | cut -f1
          )"
          test "$artifact_bytes" -le "$S1_4X_ARTIFACT_MAX_BYTES"

      - name: Upload typed regression evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s1-4x-regression-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/s1-4x-regression-evidence
          if-no-files-found: error
          retention-days: 14
