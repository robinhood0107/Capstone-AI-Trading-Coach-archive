          SCALA="$S1_4X/scala"
          RESULT_DIR="$RUNNER_TEMP/s1-4x-results"
          OUTPUT="$RUNNER_TEMP/s1-4x-scala-oci"
          mkdir -p "$OUTPUT"
          PROFILE="$(
            jq -er '.selectedProfileId | select(. == "A" or . == "B" or . == "C")' \
              "$RESULT_DIR/scala/scala-selected-profile-result.v1.json"
          )"
          CANDIDATE="$RESULT_DIR/scala/profiles/$PROFILE/candidate.jar"
          export S1_4X_DOCKER_BIN
          S1_4X_DOCKER_BIN="$(readlink -f "$(command -v docker)")"
          docker pull "$S1_4X_SCALA_BASE_IMAGE"
          "$SCALA/tools/build-oci-image.sh" \
            --candidate "$CANDIDATE" \
            --base-image "$S1_4X_SCALA_BASE_IMAGE" \
            --image-tag "s1-4x-scala:${GITHUB_SHA::12}" \
            --output "$OUTPUT/scala-oci-build-result.v1.json"
          export S1_4X_SCALA_IMAGE_REF
          S1_4X_SCALA_IMAGE_REF="$(
            jq -r '.imageId' "$OUTPUT/scala-oci-build-result.v1.json"
          )"
          "$SCALA/tools/run-oci-correctness.sh" \
            --output-dir "$OUTPUT/runtime"
          jq -e '.runtimeNetwork == "none" and .mismatchCount == 0' \
            "$OUTPUT/runtime/scala-oci-correctness-result.v1.json" >/dev/null

      - name: Upload Scala OCI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s1-4x-scala-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/s1-4x-scala-oci
          if-no-files-found: error
          retention-days: 14

