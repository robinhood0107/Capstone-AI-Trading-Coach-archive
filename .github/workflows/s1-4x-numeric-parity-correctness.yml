        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: s1-4x-scala-selected-${{ github.run_id }}
          path: ${{ runner.temp }}/s1-4x-results

      - name: Build without network and replay with runtime network none
        shell: bash
        run: |
          set -euo pipefail
